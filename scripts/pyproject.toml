[project]
name = "vn-scripts"
version = "0.1.0"
description = "Repo-level tooling for the von-neumann monorepo. Currently: depgraph.py, a stdlib dependency graph (import DAG + results ownership + paper->module figure edges) that computes the test-impact and artifact-drift blast radius of a change. Pure stdlib, deterministic, reads the tree but never runs a fold (CLAUDE.md 7)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# coverage[toml] is test-only and has no threshold; the tool itself is pure stdlib and is never a dependency of any module.
dev = ["pytest>=8.0", "coverage[toml]>=7.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["depgraph"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    'if __name__ == .__main__.:',
]
