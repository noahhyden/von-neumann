[package]
name = "swarm_rust"
version = "0.1.0"
edition = "2021"
description = "Bit-identical Rust drop-in for the swarm nearest-unsettled k-d tree query (issue #33, Phase 1)."
license = "MIT"

[lib]
name = "swarm_rust"
crate-type = ["cdylib"]

[dependencies]
# pyo3 for Python bindings and numpy for zero-copy ndarray access, pinned to a minor so maturin builds identically everywhere.
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

[profile.release]
# Every profile choice below removes a source of nondeterminism, since the Rust path must return the same SwarmResult to the printed digit (issue #33): no float reassociation, one codegen unit, abort on panic.
opt-level = 3
lto = "off"
codegen-units = 1
panic = "abort"
