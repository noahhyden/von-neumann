[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "swarm_rust"
description = "Bit-identical Rust drop-in for the swarm nearest-unsettled k-d tree query (issue #33, Phase 1)."
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps (pyo3, numpy) live in Cargo.toml; this file only lets maturin drive the build and version the wheel with the crate.
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
# Pure Rust extension with no Python source; it imports as top-level swarm_rust and swarm falls back to numba or pure Python if the import fails.
module-name = "swarm_rust"
