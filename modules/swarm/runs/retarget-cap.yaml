# Committed spec for the retarget_cap measurement; nothing here is read from the environment.
name: retarget-cap
module: swarm
entry: experiments.measure:m_retarget_cap
description: >
  Tax vs the retarget cap at Lambda=0.2, looking for a plateau.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 400
  n_seeds: 32
