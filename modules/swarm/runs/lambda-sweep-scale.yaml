# Committed spec for the lambda_sweep_scale measurement; nothing here is read from the environment.
name: lambda-sweep-scale
module: swarm
entry: experiments.measure:m_lambda_sweep_scale
description: >
  The lambda sweep at N=200k: does the headline tax survive at galactic scale?

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 200000
  n_seeds: 8
