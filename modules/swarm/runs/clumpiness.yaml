# Committed spec for the clumpiness measurement; nothing here is read from the environment.
name: clumpiness
module: swarm
entry: experiments.measure:m_clumpiness
description: >
  Tax vs star-field clumpiness (Thomas-cluster fields, Clark-Evans R) across Lambda.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 500
  n_seeds: 48
