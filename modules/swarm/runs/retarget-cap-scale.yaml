# Committed spec for the retarget_cap_scale measurement; nothing here is read from the environment.
name: retarget-cap-scale
module: swarm
entry: experiments.measure:m_retarget_cap_scale
description: >
  The retarget-cap sweep at N=200k.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 200000
  n_seeds: 8
