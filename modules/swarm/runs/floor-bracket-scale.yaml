# Committed spec for the floor_bracket_scale measurement; nothing here is read from the environment.
name: floor-bracket-scale
module: swarm
entry: experiments.measure:m_floor_bracket_scale
description: >
  The coordination floor bracket at N=200k.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 200000
  n_seeds: 8
