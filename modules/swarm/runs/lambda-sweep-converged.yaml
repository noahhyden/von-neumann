# Committed spec for the lambda_sweep_converged measurement; nothing here is read from the environment.
name: lambda-sweep-converged
module: swarm
entry: experiments.measure:m_lambda_sweep_converged
description: >
  Headline fuel/time tax vs Lambda = v/c at a CONVERGED retarget cap (128), N=262,144, 128 seeds.
  The cap=8 p2 block understates this by ~8x at every Lambda.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 262144
  n_seeds: 128
  max_retargets: 128
