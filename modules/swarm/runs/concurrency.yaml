# Committed spec for the concurrency measurement; nothing here is read from the environment.
name: concurrency
module: swarm
entry: experiments.measure:m_concurrency
description: >
  Peak and per-fraction in-flight probe counts at Lambda=0.2; keeps the per-event step trace.

runtime:
  # No RAM cap recorded for this run, so workers is blank (every core).
  workers:
  # Was `python -O`. Strips the fold's __debug__ invariants; bit-identical, ~2-3x faster.
  optimize: true
  backends:
    rust: true
    njit: true

params:
  n_stars: 500
  n_seeds: 16
