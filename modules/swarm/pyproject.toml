[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "A deterministic interstellar settlement front (ROADMAP §4, slice 1): probes spread star-to-star through a seeded field; how fast the reachable galaxy fills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "vn-core",
    "numba>=0.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
# Optional Rust fast path (issue #33); swarm falls back to numba or pure Python without it, build with `uv run --extra rust maturin develop --manifest-path rust/Cargo.toml`.
rust = ["maturin>=1.7"]

[tool.uv.sources]
vn-core = { path = "../core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# experiments/ is a namespace package at the module root (run as `python -m experiments.x`), so put the root on the path for tests to import it.
pythonpath = ["."]
