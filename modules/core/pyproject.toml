[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-core"
version = "0.1.0"
description = "Shared core primitives for the von-neumann repo. Currently: seeded mulberry32 RNG (byte-identical to the JS mirror), uncertainty quantification (distributions, seeded Monte Carlo, Sobol total-order sensitivity), and an ODE solver. Pure Python today; the layout leaves room for a future core/ rust/pyo3 speed drop-in without moving imports."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# scipy is a TEST-ONLY oracle (ODE and Sobol' gates), never a runtime dependency.
dev = ["pytest>=8.0", "scipy>=1.11", "coverage[toml]>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vn_core"]

[tool.coverage.report]
# The fold is the product; every line of it is exercised or explained. The package
# holds at 100% line+branch coverage (the build discipline), enforced here so CI fails
# on any regression. `# pragma: no cover` is permitted only on genuinely unreachable
# defensive branches (RHS overflow, singular matrices, step-count caps), each justified
# inline at the use site.
show_missing = true
skip_covered = false
fail_under = 100
