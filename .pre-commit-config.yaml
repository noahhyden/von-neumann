# AGENTS.md is generated and gitignored, so its hooks only rewrite an untracked file; modules/README.md is TRACKED, so when its table was stale the modules hook rewrites it and pre-commit fails the commit until you re-stage.
repos:
  - repo: local
    hooks:
      - id: agents-md-generate
        name: regenerate the untracked AGENTS.md tree
        entry: python3 .github/scripts/gen_agents_md.py --write
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-checkout, post-merge, post-rewrite]
      - id: agents-md-sync
        name: regenerate AGENTS.md when a rule changes
        entry: python3 .github/scripts/gen_agents_md.py --write
        language: system
        files: ^(.*/)?AGENTS\.d/.*\.md$
        pass_filenames: false
      - id: modules-readme-generate
        name: regenerate the modules/README.md inventory table
        entry: python3 .github/scripts/gen_modules_readme.py --write
        language: system
        always_run: true
        pass_filenames: false
      - id: modules-readme-check
        name: modules/README.md inventory table is fresh
        entry: python3 .github/scripts/gen_modules_readme.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
