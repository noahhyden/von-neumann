# AGENTS.md is generated and gitignored, so these hooks only ever rewrite an untracked file: they cannot dirty the index or block a commit.
repos:
  - repo: local
    hooks:
      - id: agents-md-generate
        name: regenerate the untracked AGENTS.md tree
        entry: python3 .github/scripts/gen_agents_md.py --write
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-checkout, post-merge, post-rewrite]
      - id: agents-md-sync
        name: regenerate AGENTS.md when a rule changes
        entry: python3 .github/scripts/gen_agents_md.py --write
        language: system
        files: ^(.*/)?AGENTS\.d/.*\.md$
        pass_filenames: false
