name: ci

# The standard push/PR gate: is OUR code green? Runs closure-sim pytest and the frontend parity + contract tests + build, with pimas consumed from npm as pimas-ui (lockfile-pinned, no sibling checkout).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Run the shared vn_core package (RNG, UQ, ODE, linalg) suite under the coverage gate in core/pyproject.toml.
      - name: pytest + coverage gate (vn_core)
        working-directory: core
        run: |
          uv run --extra dev coverage run -m pytest -q
          uv run --extra dev coverage report

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Run the repo tooling (depgraph.py) suite under the coverage gate in scripts/pyproject.toml, so structural drift fails here.
      - name: pytest + coverage gate (depgraph)
        working-directory: scripts
        run: |
          uv run --extra dev coverage run -m pytest -q
          uv run --extra dev coverage report
      # The papers paths-filter in this workflow is hand-maintained; this asserts it still matches the paper->module edges depgraph derives from figure content, so a new figure sourced from an unlisted module fails here instead of silently skipping that paper's rebuild.
      - name: ci.yml paths-filter matches depgraph
        working-directory: scripts
        run: uv run python depgraph.py --check-ci-filter

  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [closure-sim, probe-sim, power-budget, launch-economics, mission, multi-probe, spine, transfer, comms, assembly, isru, propellant, thermal, power-source, autonomy, shielding, reliability]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pytest ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: uv run --extra dev pytest -q

  swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Rust toolchain + maturin for the pyo3 fast-path (issue #33), so the 3-way backend oracle runs the Rust case instead of skipping it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the swarm_rust pyo3 extension into swarm's venv
        working-directory: swarm
        run: |
          uv sync --extra dev --extra rust
          uv run --extra rust maturin develop --release --manifest-path rust/Cargo.toml
      - name: pytest (deterministic settlement-front assertions, all 3 backends)
        working-directory: swarm
        run: uv run --extra dev pytest -q

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gen-versions (the sanity check below) derives each paper's version list from every commit touching papers/<slug>/.
          fetch-depth: 0
      # Figure generation runs a validated simulation ensemble and can be minutes of compute per paper; typesetting spins up a full LaTeX container, so both steps run only for papers the diff affects.
      - name: Detect which papers the diff affects
        uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            shared: &shared
              - 'frontend/src/sources.ts'
              - 'papers/scripts/**'
              - '.github/workflows/ci.yml'
            coordination_tax:
              - *shared
              - 'papers/coordination-tax/**'
              - 'swarm/**'
            electronics_wall:
              - *shared
              - 'papers/electronics-wall/**'
              - 'closure-sim/**'
            spine:
              - *shared
              - 'papers/spine/**'
              - 'spine/**'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # gen-bib/gen-index import frontend/src/sources.ts directly (Node native TS), so no install step is needed.
      - name: Generate refs.bib and refresh the papers index
        working-directory: papers
        run: |
          node scripts/gen-bib.mjs
          node scripts/gen-index.mjs
      - name: The committed papers index must match the generator output
        run: git diff --exit-code frontend/src/papers-index.ts
      # gen-versions builds the version manifest from git history (issue #7); a build artifact, so this only proves the generator runs on real history.
      - name: Generate the paper version manifest (build artifact, not committed)
        working-directory: papers
        run: |
          node scripts/gen-versions.mjs
          node -e "const {PAPER_VERSIONS}=await import('../frontend/src/papers-versions.ts'); const n=Object.values(PAPER_VERSIONS).reduce((a,v)=>a+v.length,0); if(!n){console.error('gen-versions produced no versions; is the checkout shallow?');process.exit(1);} console.log('gen-versions OK:',n,'versions');"
      # The Zenodo deposit metadata (issue #8) is built from paper.json; this guards that the network-free core (name formatting, metadata shape) stays faithful.
      - name: Zenodo metadata builder tests
        run: node --test papers/scripts/zenodo-publish.test.mjs
      - name: Typography rules - no em-dash, no en-dash, no emoji (papers/RULES.md)
        working-directory: papers
        run: node scripts/check-typography.mjs
      # Figures are generated (gitignored vector PDFs) from the validated source modules, so the paper restates only their real output (papers/RULES.md R1, P4); a figure-build failure fails the PR because the typeset needs them.
      - name: Render coordination-tax figures from committed results (swarm)
        if: steps.changed.outputs.coordination_tax == 'true'
        working-directory: swarm
        run: uv run --extra dev python -m experiments.paper_figures
      - name: Typeset coordination-tax (LaTeX) - a broken .tex fails the PR
        if: steps.changed.outputs.coordination_tax == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/coordination-tax
          root_file: main.tex
      - name: Cache electronics-wall figures
        id: figs-ew
        if: steps.changed.outputs.electronics_wall == 'true'
        uses: actions/cache@v4
        with:
          path: papers/electronics-wall/fig_*.pdf
          key: figs-electronics-wall-ci-v1-${{ hashFiles('closure-sim/src/**/*.py', 'closure-sim/pyproject.toml', 'closure-sim/uv.lock') }}
      - name: Generate electronics-wall figures (closure-sim)
        if: steps.changed.outputs.electronics_wall == 'true' && steps.figs-ew.outputs.cache-hit != 'true'
        working-directory: closure-sim
        run: uv run --extra dev python -m closure_sim.paper_figures
      - name: Typeset electronics-wall (LaTeX) - a broken .tex fails the PR
        if: steps.changed.outputs.electronics_wall == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/electronics-wall
          root_file: main.tex
      # spine figures RENDER from committed JSON (spine/experiments/results/), exactly like coordination-tax above: the heavy ensemble (spine/experiments/measure.py) runs LOCALLY and commits its deterministic seeded output; CI only plots it (a few seconds), and the spine pytest job's drift-guard re-checks that committed JSON against the fold - so no figure cache here.
      - name: Render spine figures from committed results (spine)
        if: steps.changed.outputs.spine == 'true'
        working-directory: spine
        run: uv run --extra dev python -m experiments.paper_figures
      - name: Typeset spine (LaTeX) - a broken .tex fails the PR
        if: steps.changed.outputs.spine == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/spine
          root_file: main.tex

      # Reviewable render (issue #23): on a PR, publish each paper the diff actually typeset above as a downloadable PDF, so a reviewer can eyeball the real render before merge instead of merging to check.
      - name: Stage typeset PDFs for review
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-render/papers
          for d in papers/*/; do
            [ -f "${d}main.tex" ] || continue
            slug=$(basename "$d")
            if [ -f "${d}main.pdf" ]; then
              cp "${d}main.pdf" "pr-render/papers/${slug}.pdf"
              echo "staged ${slug}.pdf"
            fi
          done
      - name: Upload rendered paper PDFs as a reviewable artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: pr-render/papers/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gen-versions step below (and the build) see every commit touching papers/<slug>/, matching the real deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend (pimas resolves via npm alias to pimas-ui)
        working-directory: frontend
        run: npm ci

      # Generate the gitignored version manifest before the tests so papers.test.ts exercises real git-derived data (it no-ops gracefully if the file is absent, but here we want it present).
      - name: Generate the paper version manifest
        run: node papers/scripts/gen-versions.mjs

      - name: Layer A - model parity vs the Python CLI (no pimas)
        working-directory: frontend
        run: npm test

      - name: Layer B - pimas contract (against the pinned pimas-ui version)
        working-directory: frontend
        run: npm run test:contract

      - name: Build the page
        working-directory: frontend
        run: npm run build

      # Reviewable render (issue #23): on a PR, upload the built bundle so a reviewer can download and serve it locally (the page is an ES-module SPA - it must be served, not opened via file://; `npm run preview` does the CI-parity build + serve).
      - name: Upload the built frontend as a reviewable artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
