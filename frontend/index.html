  /*__DESIGN_TOKENS__*/
  * { box-sizing: border-box; }
  body { margin: 0; background-color: var(--ground); color: var(--text); font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--sp-3); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: var(--fs-h1); line-height: var(--lh-tight); margin: 0 0 var(--sp-3); }
  h2 { font-family: var(--serif); font-weight: 600; font-size: var(--fs-h2); line-height: var(--lh-tight); margin: 0 0 var(--sp-3); }
  em { font-family: var(--serif); font-style: italic; }
  .lede { font-size: var(--fs-lede); }
  p { margin: 0 0 var(--sp-3); }
  p, ul.gaps { max-width: var(--measure); }
  a { color: var(--chip); text-decoration: underline; text-underline-offset: 0.2em; text-decoration-color: var(--line); }
  a:hover { text-decoration-color: var(--chip); }
  ::selection { background: var(--laurel); color: var(--ground); }
  strong { color: var(--text); font-weight: 600; }
  section { padding: var(--sp-6) 0; border-top: 1px solid var(--line); }
  section.hero { padding: var(--sp-6) 0 var(--sp-4); border-top: none; }
  .label, .marker, .panel-head, .preview .ph { font-family: var(--mono); font-size: var(--fs-tiny); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted); margin: 0 0 var(--sp-2); }
  .marker b { color: var(--metal); font-weight: 600; }

  .panel { border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-controls, .panel-readouts, .panel-plain { padding: var(--sp-3); }
  .fig { margin: 0; padding: var(--sp-3) var(--sp-3) var(--sp-2); border: 1px solid var(--line); border-radius: var(--radius); }
  .figcap { font-family: var(--mono); font-size: var(--fs-tiny); color: var(--muted); letter-spacing: var(--track-label); margin: var(--sp-2) 0 0; line-height: var(--lh-mono); }
  svg.chart { display: block; width: 100%; height: auto; }

  .lab { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: var(--sp-3); margin-top: var(--sp-1); }

  .ctl { margin-bottom: var(--sp-2); }
  .ctl-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--sp-1); }
  .ctl-label { font-size: var(--fs-body); }
  .ctl-val { font-family: var(--mono); font-weight: 500; color: var(--metal); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: var(--radius); background: var(--granite); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: var(--radius); background: var(--granite); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6px; box-sizing: border-box; border-radius: 50%; background: var(--metal); cursor: pointer; border: 2px solid var(--ground); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: var(--metal); cursor: pointer; border: 2px solid var(--ground); }

  .stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px solid var(--line); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .what { font-size: var(--fs-body); color: var(--text); }
  .stat-row .what small { display: block; font-family: var(--mono); font-size: var(--fs-tiny); color: var(--muted); letter-spacing: var(--track-label); }
  .val { font-family: var(--mono); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: var(--fs-body); }
  .val-plain { color: var(--text); } .val-metal { color: var(--metal); } .val-chip { color: var(--chip); } .val-good { color: var(--good); } .val-bad { color: var(--bad); }

  .btnrow { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-1); }
  .act { font-family: var(--mono); font-size: var(--fs-small); letter-spacing: var(--track-label); padding: var(--sp-1) var(--sp-2); border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .act:hover { background: var(--surface); }
  .act-primary { border-color: var(--chip); color: var(--chip); }
  .act-commit { border-color: var(--good); color: var(--good); }
  .act-ghost { color: var(--muted); }

  .regime { display: flex; height: var(--sp-4); border-radius: var(--radius); overflow: hidden; margin: var(--sp-1) 0; border: 1px solid var(--line); }
  .regime span { display: block; height: 100%; }
  .rg-material { background: var(--metal); }
  .rg-energy { background: var(--bad); }
  .rg-resupply { background: var(--chip); }
  .legend { display: flex; gap: var(--sp-3); font-family: var(--mono); font-size: var(--fs-tiny); color: var(--muted); letter-spacing: var(--track-label); }
  .legend b { display: inline-block; width: 9px; height: 9px; border-radius: var(--radius); margin-right: var(--sp-1); vertical-align: middle; }

  .explain { border-left: 2px solid var(--metal); padding: var(--sp-1) 0 var(--sp-1) var(--sp-3); margin: var(--sp-1) 0 0; color: var(--text); font-size: var(--fs-lede); line-height: var(--lh-body); }

  .preview { margin-top: var(--sp-3); border: 1px dashed var(--chip); border-radius: var(--radius); padding: var(--sp-3); }
  .preview .ph { color: var(--chip); }
  .diff { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .diff .d span { display: block; font-family: var(--mono); font-size: var(--fs-tiny); text-transform: uppercase; letter-spacing: var(--track-label); color: var(--muted); }
  .diff .d b { font-family: var(--mono); font-size: var(--fs-lede); }
  .arrow { color: var(--muted); font-family: var(--mono); }

  pre.desc { font-family: var(--mono); font-size: var(--fs-tiny); line-height: var(--lh-mono); color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-2); overflow-x: auto; margin: 0 0 var(--sp-2); white-space: pre; }
  .cause { font-family: var(--mono); font-size: var(--fs-small); color: var(--text); line-height: var(--lh-body); }
  .cause .k { color: var(--muted); }
  .cause .w { color: var(--metal); } .cause .c { color: var(--chip); }
  .note { font-family: var(--mono); font-size: var(--fs-small); color: var(--muted); line-height: var(--lh-mono); }
  footer { padding: var(--sp-5) 0 var(--sp-6); border-top: 1px solid var(--line); }
  footer p { font-family: var(--mono); font-size: var(--fs-small); color: var(--muted); line-height: var(--lh-body); margin: 0; }

  .cite { position: relative; display: inline; cursor: help; }
  .cite > sup { font-family: var(--mono); font-size: 0.62em; color: var(--chip); font-weight: 600; padding: 4px 3px; margin: -4px -3px; }
  .cite:hover > sup, .cite:focus-within > sup { text-decoration: underline; }
  .cite-pop {
    position: absolute; left: 0; bottom: 1.5em; z-index: 60;
    width: min(360px, 78vw);
    background: var(--panel); border: 1px solid var(--chip); border-radius: var(--radius);
    padding: var(--sp-2);
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
    font-family: var(--mono); font-size: var(--fs-tiny); line-height: var(--lh-mono);
    color: var(--text); white-space: normal; text-align: left; pointer-events: none;
    font-weight: 400; letter-spacing: 0;
  }
  .cite:hover .cite-pop, .cite:focus-within .cite-pop { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
  .cite-item { display: block; }
  .cite-item + .cite-item { margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
  .cite-ref { display: block; }
  .cite-ref b { color: var(--text); }
  .cite-pop a { display: inline-block; margin-top: var(--sp-1); word-break: break-all; font-size: var(--fs-tiny); }
  .cite-nolink { display: block; margin-top: var(--sp-1); color: var(--muted); font-style: italic; }
  .cite-use { display: block; margin-top: var(--sp-1); color: var(--muted); }

  .nav-brand { font-family: var(--serif); font-weight: 600; margin-right: var(--sp-1); background: none; border: 0; color: var(--text); cursor: pointer; font-size: var(--fs-body); padding: 0; }
  .nav-brand:hover { color: var(--chip); }
  .mod-row { padding: var(--sp-3) 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .mod-row:last-child { border-bottom: none; }
  .mod-row:hover .mod-name, .mod-row:focus-visible .mod-name { color: var(--chip); }
  .mod-head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
  .mod-name { font-family: var(--mono); font-weight: 500; font-size: var(--fs-body); }
  .mod-status { font-family: var(--mono); font-size: var(--fs-tiny); text-transform: uppercase; letter-spacing: var(--track-label); padding: 2px var(--sp-1); border-radius: var(--radius); border: 1px solid var(--line); }
  .mod-status.good { color: var(--good); border-color: var(--good); }
  .mod-status.chip { color: var(--chip); border-color: var(--chip); }
  .mod-desc { margin: var(--sp-1) 0 0; color: var(--muted); }
  ul.gaps { margin: var(--sp-1) 0 0; padding-left: var(--sp-3); }
  ul.gaps li { margin-bottom: var(--sp-2); }

  .src { padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
  .src:last-child { border-bottom: none; }
  .src-top { display: flex; gap: var(--sp-2); align-items: baseline; }
  .src-num { font-family: var(--mono); font-weight: 500; color: var(--chip); }
  .src-cite { font-size: var(--fs-body); }
  .src-cite b { color: var(--text); }
  .src-meta { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin: var(--sp-1) 0 0 var(--sp-4); font-family: var(--mono); font-size: var(--fs-tiny); letter-spacing: var(--track-label); }
  .src-strength { color: var(--metal); }
  .src-strength.st-vendor, .src-strength.st-wiki, .src-strength.st-grey { color: var(--bad); }
